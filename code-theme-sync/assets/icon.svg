<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1f3b"/>
      <stop offset="50%" stop-color="#121426"/>
      <stop offset="100%" stop-color="#0a0c16"/>
    </linearGradient>
    <radialGradient id="glowL1" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR1" cx="80%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow1" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Braces -->
    <linearGradient id="braceL1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="braceR1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <!-- Vibrant Paint Spectrum -->
    <linearGradient id="paintWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Brush Colors -->
    <linearGradient id="brushHandle1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="brushFerrule1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="brushBristles1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="bloom1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad1)"/>
  <rect width="512" height="512" rx="112" fill="url(#glowL1)"/>
  <rect width="512" height="512" rx="112" fill="url(#glowR1)"/>
  <rect width="512" height="512" rx="112" fill="url(#centerGlow1)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Left Brace { -->
  <g filter="url(#bloom1)">
    <path d="M 120 132 C 96 132, 80 148, 80 174 L 80 224 C 80 242, 64 256, 48 256 C 64 256, 80 270, 80 288 L 80 338 C 80 364, 96 380, 120 380"
          fill="none" stroke="url(#braceL1)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Brace } -->
  <g filter="url(#bloom1)">
    <path d="M 392 132 C 416 132, 432 148, 432 174 L 432 224 C 432 242, 448 256, 464 256 C 448 256, 432 270, 432 288 L 432 338 C 432 364, 416 380, 392 380"
          fill="none" stroke="url(#braceR1)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Glowing Paint Swirl Waves (Painted across the center) -->
  <g filter="url(#bloom1)">
    <!-- Primary vibrant paint wave -->
    <path d="M 140 315 C 190 355, 245 320, 260 270 C 275 220, 320 215, 368 245"
          fill="none" stroke="url(#paintWave1)" stroke-width="18" stroke-linecap="round"/>
    <!-- Secondary harmonic stroke -->
    <path d="M 155 265 C 200 285, 235 255, 255 225 C 275 195, 315 185, 355 205"
          fill="none" stroke="url(#paintWave1)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

    <!-- Glowing Paint Drops -->
    <circle cx="150" cy="345" r="7" fill="#f472b6"/>
    <circle cx="205" cy="365" r="5.5" fill="#a855f7"/>
    <circle cx="360" cy="275" r="6" fill="#38bdf8"/>
    <circle cx="372" cy="215" r="5" fill="#fbbf24"/>
  </g>

  <!-- Bold Angled Paintbrush -->
  <g filter="url(#bloom1)" transform="rotate(-36, 265, 245)">
    <!-- Long ergonomic handle -->
    <path d="M 256 50 C 256 35, 274 35, 274 50 L 278 165 L 252 165 Z" fill="url(#brushHandle1)"/>
    <!-- Handle highlight edge -->
    <path d="M 256 50 L 254 165" stroke="#94a3b8" stroke-width="2" opacity="0.4"/>
    <!-- Metallic Ferrule -->
    <rect x="250" y="165" width="30" height="28" rx="4" fill="url(#brushFerrule1)"/>
    <line x1="250" y1="178" x2="280" y2="178" stroke="#64748b" stroke-width="2"/>
    <!-- Bristles -->
    <path d="M 250 193 L 246 235 C 246 256, 258 274, 265 280 C 272 274, 284 256, 284 235 L 280 193 Z" fill="url(#brushBristles1)"/>
    <!-- Wet paint tip -->
    <path d="M 251 234 C 255 254, 261 268, 265 278 C 269 268, 275 254, 279 234 C 272 244, 258 244, 251 234 Z" fill="#f43f5e"/>
  </g>
</svg>