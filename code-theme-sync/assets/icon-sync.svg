<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18223d"/>
      <stop offset="55%" stop-color="#10172b"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>

    <!-- Corner Ambient Lighting -->
    <radialGradient id="topGlow" cx="20%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="botGlow" cx="80%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Gradients for Braces -->
    <linearGradient id="braceLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="braceRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <!-- Chevron Gradient -->
    <linearGradient id="chevGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Bloom Filter -->
    <filter id="bloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="url(#topGlow)"/>
  <rect width="512" height="512" rx="112" fill="url(#botGlow)"/>
  <rect width="512" height="512" rx="112" fill="url(#centerGlow)"/>

  <!-- Glass Rim -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.30"/>

  <!-- LEFT BRACE { -->
  <g filter="url(#bloom)">
    <path d="M 112 152
             C 92 152, 78 166, 78 188
             L 78 228
             C 78 244, 66 256, 52 256
             C 66 256, 78 268, 78 284
             L 78 324
             C 78 346, 92 360, 112 360"
          fill="none" stroke="url(#braceLeft)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- RIGHT BRACE } -->
  <g filter="url(#bloom)">
    <path d="M 400 152
             C 420 152, 434 166, 434 188
             L 434 228
             C 434 244, 446 256, 460 256
             C 446 256, 434 268, 434 284
             L 434 324
             C 434 346, 420 360, 400 360"
          fill="none" stroke="url(#braceRight)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- LEFT SYNTAX BLOCK (Indented Code Lines) -->
  <g filter="url(#bloom)">
    <!-- Line 1: Keyword -->
    <rect x="114" y="184" width="60" height="13" rx="6.5" fill="#c084fc"/>
    <!-- Line 2: Indented object key -->
    <rect x="134" y="213" width="76" height="13" rx="6.5" fill="#64748b"/>
    <!-- Line 3: Indented property -->
    <rect x="146" y="242" width="68" height="13" rx="6.5" fill="#475569"/>
    <!-- Line 4: Highlighted token (cyan) -->
    <rect x="134" y="271" width="94" height="13" rx="6.5" fill="#38bdf8"/>
    <!-- Line 5: String value -->
    <rect x="134" y="300" width="72" height="13" rx="6.5" fill="#64748b"/>
    <!-- Line 6: Closing scope + accent tag -->
    <rect x="114" y="329" width="46" height="13" rx="6.5" fill="#818cf8"/>
    <rect x="168" y="329" width="44" height="13" rx="6.5" fill="#f59e0b"/>
  </g>

  <!-- CENTER TRANSFORMATION -->
  
    <g filter="url(#bloom)">
      <path d="M 246 236 L 296 236 M 284 224 L 298 236 L 284 248" fill="none" stroke="url(#chevGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 298 276 L 248 276 M 260 264 L 246 276 L 260 288" fill="none" stroke="url(#chevGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

  <!-- RIGHT THEME PALETTE BLOCK -->
  <g filter="url(#bloom)">
    <!-- Line 1: Primary Accent -->
    <rect x="334" y="196" width="60" height="13" rx="6.5" fill="#a78bfa"/>
    <!-- Line 2: Sky Blue -->
    <rect x="334" y="225" width="78" height="13" rx="6.5" fill="#60a5fa"/>
    <!-- Line 3: Electric Cyan -->
    <rect x="334" y="254" width="78" height="13" rx="6.5" fill="#22d3ee"/>
    <!-- Line 4: Mint Teal -->
    <rect x="334" y="283" width="62" height="13" rx="6.5" fill="#2dd4bf"/>
    <!-- Line 5: Warm Gold / Amber Accent Token -->
    <rect x="334" y="312" width="50" height="13" rx="6.5" fill="#fbbf24"/>
  </g>
</svg>